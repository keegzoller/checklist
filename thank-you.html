<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Vermac Construction</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#58272F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--brand-maroon:#58272F;--brand-accent:#A62B34;--brand-accent-hover:#86212A;--off-white:#F8F4F3;--gray-700:#43393B}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--brand-maroon);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{max-width:560px}
.mark{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:28px;letter-spacing:.5px;color:#fff;margin-bottom:8px}
.mark .mm{color:#e79aa0}
.sub{font-size:11px;letter-spacing:.24em;font-weight:600;color:rgba(255,255,255,.72);margin-bottom:40px}
.check{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px}
.check svg{width:44px;height:44px;color:#fff}
h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:34px;line-height:1.15;margin-bottom:16px}
p{font-size:18px;color:#f3e7e6;line-height:1.6;margin-bottom:32px}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 28px;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid transparent;transition:transform .18s ease,background .18s ease}
.btn-primary{background:var(--brand-accent);color:#fff}
.btn-primary:hover{background:var(--brand-accent-hover);transform:translateY(-2px)}
.btn-ghost{border-color:rgba(255,255,255,.7);color:#fff}
.btn-ghost:hover{background:#fff;color:var(--brand-maroon)}
</style>
</head>
<body>
<div class="card">
  <img src="images/vermac-logo-white.png" alt="Vermac Construction Inc" style="height:64px;width:auto;margin-bottom:32px">
  <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>
  <h1>Thank you — we got it!</h1>
  <p>Thanks for reaching out to Vermac Construction. We'll review your request and get back to you shortly. Need us sooner? Give us a call.</p>
  <div class="actions">
    <a class="btn btn-primary" href="tel:+15186368008">Call 518-636-8008</a>
    <a class="btn btn-ghost" href="/">Back to Home</a>
  </div>
</div>
</body>
</html>
